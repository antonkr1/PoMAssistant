server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers générés par Vite : nom haché, cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache (sinon une nouvelle version n'est pas vue)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router (mode history) : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
