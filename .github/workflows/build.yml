name: build-and-push

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan sécurité (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Installer node 
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances et exécuter les tests unitaires
        run: |
          npm ci
          npm test


  image:
    runs-on: ubuntu-latest
    # Environnements GitHub "prod" (branche main) et "dev" (branche dev) :
    # Variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
    needs: tests
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Nom de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Construction de l'image Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Vérification de l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE }}:${{ env.TAG }}"
          scanners: "vuln"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:$BRANCH"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$BRANCH"

      - name: Mettre à jour le déploiement (homelab-devops)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/antonkr1/homelab-devops.git" gitops
          cd gitops
          sed -i "s|image: ghcr.io/antonkr1/pomassistant:.*|image: ${IMAGE}:${TAG}|" apps/pomassistant/deployment.yaml
          if git diff --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "pomassistant: déployer ${TAG}" -m "Source : https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main

  sonarqube:
    name: sonarqube
    needs: tests
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Rejoindre Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: -Dsonar.qualitygate.wait=true