name: build-and-push

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan sécurité (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Installer node 
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances et exécuter les tests unitaires
        run: |
          npm ci
          npm test


  image:
    runs-on: ubuntu-latest
    # Environnements GitHub "prod" (branche main) et "dev" (branche dev) :
    # Variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
    needs: tests
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push' 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Un tag du commit
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Construction sans publication de l'image Docker (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Vérification de l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE }}:${{ env.TAG }}"
          scanners: "vuln"
          severity: "CRITICAL"
          exit-code: "1"


      - name: Mettre à jour le déploiement (homelab-devops)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/antonkr1/homelab-devops.git" gitops
          cd gitops
          sed -i "s|image: ghcr.io/antonkr1/pomassistant:.*|image: ${IMAGE}:${TAG}|" apps/pomassistant/deployment.yaml
          if git diff --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "pomassistant: déployer ${TAG}" -m "Source : https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main